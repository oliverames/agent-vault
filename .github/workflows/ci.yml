name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate shell scripts
        run: bash -n scripts/*.sh script/*.sh

      - name: Run tests
        run: swift test

      - name: Build and verify release archive
        run: ./scripts/package-release.sh

      - name: Upload ad-hoc test package
        uses: actions/upload-artifact@v4
        with:
          name: AgentVault-ad-hoc
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

name: Signed release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  sign-notarize-release:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: bash -n scripts/*.sh script/*.sh

      - name: Run tests
        run: swift test

      - name: Validate release credentials
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          AGENT_VAULT_SENTRY_DSN: ${{ secrets.AGENT_VAULT_SENTRY_DSN }}
        run: |
          required=(
            MACOS_CERTIFICATE_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGNING_IDENTITY
            NOTARY_API_KEY_BASE64
            NOTARY_KEY_ID
            NOTARY_ISSUER_ID
            AGENT_VAULT_SENTRY_DSN
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 2
            fi
          done

      - name: Check tag against app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AppResources/Info.plist)"
          if [ "${GITHUB_REF_NAME#v}" != "$app_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $app_version" >&2
            exit 1
          fi

      # Before any signing material exists on the runner: a pinned release
      # binary checked against the SHA-256 GitHub publishes for that asset,
      # never an install script.
      - name: Install sentry-cli
        env:
          SENTRY_CLI_VERSION: "3.4.2"
          SENTRY_CLI_SHA256: "5e724365cdbbc42e4db7b1a1081adb3764dbdea5f26e94ae2124012cf65a8350"
        run: |
          install_dir="$RUNNER_TEMP/sentry-cli"
          mkdir -p "$install_dir"
          curl -sSfL -o "$install_dir/sentry-cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/$SENTRY_CLI_VERSION/sentry-cli-Darwin-universal"
          echo "$SENTRY_CLI_SHA256  $install_dir/sentry-cli" | shasum -a 256 -c -
          chmod 755 "$install_dir/sentry-cli"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/agent-vault-signing.keychain-db"
          certificate="$RUNNER_TEMP/agent-vault-signing.p12"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Write notarization API key
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify
        env:
          # Crash reporting: every signed release carries the DSN.
          SENTRY_DSN: ${{ secrets.AGENT_VAULT_SENTRY_DSN }}
          REQUIRE_SENTRY_DSN: "1"
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARIZE: "1"
          REQUIRE_DISTRIBUTION_SIGNATURE: "1"
          REQUIRE_NOTARIZED: "1"
        run: ./scripts/package-release.sh

      # Only this step sees the Sentry token. Enrichment, not a release gate:
      # a missing token or failed upload leaves a warning, and the dSYM is
      # kept in the workflow artifact for a later scripts/upload-dsyms.sh run.
      - name: Upload dSYM to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN secret is not set; dSYM not uploaded."
            exit 0
          fi
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AppResources/Info.plist)"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' AppResources/Info.plist)"
          dsym_dir="$RUNNER_TEMP/dsym"
          mkdir -p "$dsym_dir"
          ditto -x -k "build/AgentVault-$version.dSYM.zip" "$dsym_dir"
          ./scripts/upload-dsyms.sh "com.oliverames.AgentVault@$version+$build" "$dsym_dir/AgentVault.app.dSYM" \
            || echo "::warning::Sentry dSYM upload failed; retry with scripts/upload-dsyms.sh."

      - name: Upload signed package
        uses: actions/upload-artifact@v7
        with:
          name: AgentVault-signed-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.sha256
            build/*.dSYM.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip \
            dist/*.sha256 \
            --verify-tag \
            --title "Agent Vault $GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}"
